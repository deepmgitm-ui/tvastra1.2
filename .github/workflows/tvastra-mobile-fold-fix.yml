name: Tvastra mobile fold fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply compact mobile fold
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('assets/product-media-full-view.css'); s=p.read_text(); m='/* Tvastra mobile fold: keep the current media size, but pull the product information upward so Colour is visible in the initial viewport. */'; extra='''\n\n/* Tvastra mobile fold: keep the current media size, but pull the product information upward so Colour is visible in the initial viewport. */\n@media (max-width: 767px) {\n  .main-product-page {\n    padding-top: 8px !important;\n  }\n\n  .main-product-page .product-gallery {\n    margin-bottom: -24px !important;\n  }\n\n  .main-product-page .product-gallery .product-thumb-wrap {\n    margin-top: 2px !important;\n    padding-bottom: 0 !important;\n  }\n\n  .main-product-page .product-summary {\n    margin-top: 0 !important;\n  }\n\n  .main-product-page .product-summary > .position-sticky {\n    padding-top: 0 !important;\n  }\n}\n'''; p.write_text(s if m in s else s+extra)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/product-media-full-view.css
          git rm -f .github/workflows/tvastra-mobile-fold-fix.yml assets/.tvastra-mobile-fold-trigger
          git commit -m "Compact mobile product fold"
          git push origin main
